spring:
  application:
    name: hhplus_w2

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE:ecommerce}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:hhplus}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update  # 개발 환경: update, 운영 환경: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        show_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100  # N+1 문제 해결 (코치님 피드백 반영)
    open-in-view: false

  sql:
    init:
      mode: never

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all  # 모든 replica가 메시지를 받았음을 확인 (최고 수준의 안정성)
      retries: 3
      properties:
        enable.idempotence: true  # 중복 방지
        max.in.flight.requests.per.connection: 5

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ecommerce-consumer-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest  # 처음부터 메시지 읽기
      enable-auto-commit: false  # 수동 커밋 (메시지 처리 완료 후 커밋)
      properties:
        spring.json.trusted.packages: "*"  # JSON 역직렬화 허용 패키지
        isolation.level: read_committed  # 커밋된 메시지만 읽기

    listener:
      ack-mode: manual  # 수동 커밋 모드

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Logging
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
